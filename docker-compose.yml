services:
  application:
    container_name: foody-application
    image: node:lts-alpine
    ports:
      - "3000:3000"
    volumes:
      - ./code:/home/node/code
    working_dir: /home/node/code/foody-application
    command: "npm run dev"
    depends_on: 
      - backend
    environment:
      - HOST=0.0.0.0
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=100
    tty: true
  backend:
    container_name: foody-backend
    image: mongo:latest
    restart: always
    environment:
      DB_NAME: foody
      MONGO_INITDB_DATABASE: foody
    ports:
      - 27017:27017
    volumes:
      - "./.docker/foody-backend/seed-mongodb.js:/docker-entrypoint-initdb.d/seed-mongodb.js"
      - mongodb_data_container:/data/db
volumes:
  mongodb_data_container:
